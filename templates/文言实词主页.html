<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文言实词 · 主页</title>
  <style>
    :root {
      --paper: #F5F0E6;
      --paper-dark: #E8E0D1;
      --ink: #2C2C2C;
      --ink-light: #5A5247;
      --cinnabar: #C45C48;
      --cinnabar-dark: #A34534;
      --seal: #8B3A3A;
      --bamboo: #6B8E6B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", serif;
      color: var(--ink);
      background-color: #E6DFD0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,0,0,0.03) 0%, transparent 12%),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0%, transparent 15%),
        linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px),
        linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
    }

    .scroll {
      width: 100%;
      max-width: 720px;
      background: var(--paper);
      border-radius: 4px;
      box-shadow:
        0 1px 1px rgba(0,0,0,0.08),
        0 8px 24px rgba(0,0,0,0.12),
        inset 0 0 60px rgba(139, 116, 85, 0.08);
      position: relative;
      overflow: hidden;
    }

    .scroll::before,
    .scroll::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 14px;
      background: linear-gradient(90deg, #C4B49A 0%, #D9CDB8 40%, #D9CDB8 60%, #B8A68C 100%);
      box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
    }
    .scroll::before { left: 0; border-radius: 4px 0 0 4px; }
    .scroll::after { right: 0; border-radius: 0 4px 4px 0; }

    .content {
      padding: 56px 48px;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 44px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      padding-bottom: 28px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.22em;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--ink-light);
      letter-spacing: 0.15em;
    }

    .seal {
      display: inline-block;
      width: 46px;
      height: 46px;
      line-height: 46px;
      margin-left: 10px;
      border: 2px solid var(--cinnabar);
      color: var(--cinnabar);
      font-size: 13px;
      font-weight: 700;
      border-radius: 4px;
      transform: rotate(-6deg);
      opacity: 0.9;
    }

    .intro {
      text-align: center;
      font-size: 16px;
      line-height: 2;
      color: var(--ink-light);
      margin-bottom: 36px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

    .feature {
      background: rgba(255,255,255,0.35);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 2px;
      padding: 22px 14px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .feature:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    .feature-icon {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .feature-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
      letter-spacing: 0.08em;
    }

    .feature-desc {
      font-size: 12px;
      color: var(--ink-light);
      line-height: 1.6;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-bottom: 40px;
      padding: 18px 0;
      border-top: 1px dashed rgba(0,0,0,0.12);
      border-bottom: 1px dashed rgba(0,0,0,0.12);
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: var(--cinnabar);
    }

    .stat-label {
      font-size: 12px;
      color: var(--ink-light);
      letter-spacing: 0.08em;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a.button {
      display: inline-block;
      font-family: inherit;
      font-size: 16px;
      padding: 14px 36px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-align: center;
    }

    .btn-primary {
      background: var(--cinnabar);
      color: #fff;
      box-shadow: 0 4px 14px rgba(196, 92, 72, 0.28);
    }
    .btn-primary:hover { background: var(--cinnabar-dark); transform: translateY(-1px); }

    .btn-secondary {
      background: transparent;
      color: var(--ink-light);
      border: 1px solid rgba(0,0,0,0.2);
    }
    .btn-secondary:hover { background: rgba(0,0,0,0.04); }

    footer {
      text-align: center;
      margin-top: 36px;
      font-size: 12px;
      color: var(--ink-light);
      letter-spacing: 0.08em;
    }

    @media (max-width: 640px) {
      .content { padding: 40px 28px; }
      h1 { font-size: 24px; }
      .features { grid-template-columns: 1fr; }
      .stats { gap: 28px; }
    }
  </style>
</head>
<body>
  <main class="scroll">
    <div class="content">
      <header>
        <h1>文言实词<span class="seal">记</span></h1>
        <p class="subtitle">积跬步以至千里 · 聚一词以通古文</p>
      </header>

      <p class="intro">
        精选课内常见文言实词，一词一卡，附释义与出处。<br>
        日诵数词，循序渐进，于卷轴纸墨间温习古文根基。
      </p>

      <div class="features">
        <div class="feature">
          <div class="feature-icon">📜</div>
          <div class="feature-title">一词一卡</div>
          <div class="feature-desc">字形、读音、释义、例句，条理分明</div>
        </div>
        <a class="feature" href="文言实词自测.html" style="text-decoration: none; color: inherit;">
          <div class="feature-icon">🎯</div>
          <div class="feature-title">自测模式</div>
          <div class="feature-desc">遮蔽释义，检验记忆，即时反馈</div>
        </a>
        <a class="feature" href="文言实词选义.html" style="text-decoration: none; color: inherit;">
          <div class="feature-icon">🧩</div>
          <div class="feature-title">语境辨义</div>
          <div class="feature-desc">据例句推断词义，四选一巩固理解</div>
        </a>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-number" id="totalWords">12</div>
          <div class="stat-label">实词总数</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="learnedWords">0</div>
          <div class="stat-label">已诵词数</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="reviewDue">0</div>
          <div class="stat-label">待复习</div>
        </div>
      </div>

      <div class="actions">
        <a class="button btn-primary" href="文言实词背诵.html">开始诵记</a>
        <a class="button btn-secondary" href="文言实词自测.html">进入自测</a>
      </div>

      <footer>
        日诵一词，温故知新
      </footer>
    </div>
  </main>

  <script>
    function refreshStats() {
      // 从 wenyan_word_stats 读取学习进度（与单页应用保持一致）
      var stats = JSON.parse(localStorage.getItem('wenyan_word_stats') || '{}');
      var completed = Object.values(stats).filter(function(s) { return s.completed; }).length;
      document.getElementById('learnedWords').textContent = completed;

      // 待复习数量：nextReviewDate <= 今天
      var today = new Date().toISOString().slice(0, 10);
      var due = Object.keys(stats).filter(function(w) {
        var s = stats[w];
        return s.completed && s.nextReviewDate && s.nextReviewDate <= today;
      }).length;
      document.getElementById('reviewDue').textContent = due;

      // 兼容旧存储：如果 wenyan_word_stats 为空，尝试 wenyan_learned
      if (completed === 0) {
        var learned = JSON.parse(localStorage.getItem('wenyan_learned') || '[]');
        if (learned.length > 0) document.getElementById('learnedWords').textContent = learned.length;
      }
    }
    refreshStats();
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) refreshStats();
    });
  </script>
</body>
</html>
